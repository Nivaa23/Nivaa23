<svg width="850" height="140" viewBox="0 0 850 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes pulse-line {
      0%, 100% { stroke-dashoffset: 0; opacity: 0.4; }
      50% { stroke-dashoffset: -20; opacity: 1; }
    }
    @keyframes node-pulse {
      0%, 100% { stroke: #1E293B; stroke-width: 1; }
      50% { stroke: #38BDF8; stroke-width: 1.5; }
    }
    .flow-line { stroke-dasharray: 6, 6; animation: pulse-line 3s infinite linear; }
    .node-box { animation: node-pulse 4s infinite ease-in-out; }
  </style>

  <!-- Background Canvas -->
  <rect width="850" height="140" rx="10" fill="#0B0F17"/>
  <rect x="0.5" y="0.5" width="849" height="139" rx="9.5" stroke="#1E293B" stroke-opacity="0.8"/>

  <!-- NODE 1: DESIGN -->
  <g transform="translate(40, 24)">
    <rect class="node-box" width="220" height="92" rx="8" fill="#0F172A" stroke="#1E293B"/>
    <!-- Wireframe / Layers Icon -->
    <rect x="20" y="20" width="28" height="20" rx="3" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1.2"/>
    <rect x="26" y="26" width="28" height="20" rx="3" fill="#0F172A" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="64" y="32" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" letter-spacing="1">01 / DESIGN</text>
    <text x="64" y="48" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Product &amp; UI Systems</text>
    <text x="20" y="72" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">Wireframes · Design Tokens</text>
  </g>

  <!-- CONNECTION LINE 1 -> 2 -->
  <path class="flow-line" d="M260 70H315" stroke="#38BDF8" stroke-width="2"/>
  <polygon points="315,66 323,70 315,74" fill="#38BDF8"/>

  <!-- NODE 2: BUILD -->
  <g transform="translate(325, 24)">
    <rect class="node-box" width="220" height="92" rx="8" fill="#0F172A" stroke="#1E293B"/>
    <!-- Code Bracket Icon -->
    <rect x="20" y="20" width="32" height="26" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="26" y="37" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="700">&lt;/&gt;</text>
    <text x="64" y="32" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" letter-spacing="1">02 / BUILD</text>
    <text x="64" y="48" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Frontend Engineering</text>
    <text x="20" y="72" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">React · Next.js · 3D Web</text>
  </g>

  <!-- CONNECTION LINE 2 -> 3 -->
  <path class="flow-line" d="M545 70H600" stroke="#38BDF8" stroke-width="2"/>
  <polygon points="600,66 608,70 600,74" fill="#38BDF8"/>

  <!-- NODE 3: AI -->
  <g transform="translate(610, 24)">
    <rect class="node-box" width="200" height="92" rx="8" fill="#0F172A" stroke="#1E293B"/>
    <!-- AI Sparkle / Node Icon -->
    <circle cx="36" cy="33" r="12" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1.2"/>
    <path d="M36 26V40M29 33H43" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
    <text x="60" y="32" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" letter-spacing="1">03 / AI</text>
    <text x="60" y="48" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Intelligence</text>
    <text x="20" y="72" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">LLMs · Prompts · Workflows</text>
  </g>
</svg>
